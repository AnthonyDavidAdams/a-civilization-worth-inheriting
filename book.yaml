title: "A Civilization Worth Inheriting"
subtitle: "A Pattern Language for the Next Thousand Years"
author: "Anthony David Adams"

trim:
  width_in: 6.0
  height_in: 9.0
margins:
  inside_in: 0.875
  outside_in: 0.625
  top_in: 0.8
  bottom_in: 0.8
indent_in: 0.2
openright: false           # 108 short patterns run continuously; parts still open recto
justified: true
hyphenation: true
layout_priority: balanced

body:
  font: "EB Garamond"
  size_pt: 11
  line_spacing: 1.3
  paragraph_style: indented

heading_font: "EB Garamond"

chapter_number:
  show: true
  format: numeral
  font: "EB Garamond"
  size_pt: 40
chapter_title:
  font: "EB Garamond"
  size_pt: 22
  align: left
  bold: false
  italic: true


running_head:
  layout: author_title
  font: "EB Garamond"
  size_pt: 9

drop_caps: false
scene_break: emblem
emblem: rings            # seven rings of the Earth flag: title pages, part pages, chapter ends
footnotes:
  location: page
  size_multiplier: 1.0

toc: true
toc_depth: 0               # parts + chapters only; 108 patterns x 3 sections would swamp it
copyright_year: 2026

## Galley coach: one QR page for the whole book, after pattern 108.
galley:
  url: "https://civilization.galley.so"
  heading: "Talk with this book"
  body: "This book has a coach: an AI that has read every pattern and can answer questions, find the one you half remember, and help you assemble a working language for your own place. Scan the code or visit the address below. The conversation is free."
  caption: "Ask the book anything"

front_matter:
  - manuscript/00-FRONT/02-the-patterns-at-a-glance.md
  - manuscript/00-FRONT/03-how-to-use-this-language.md

back_matter:
  - manuscript/99-BACK/01-a-working-kit.md
  - manuscript/99-BACK/02-entry-points-by-scale-and-problem.md
  - manuscript/99-BACK/04-evidence-disagreements-and-revision.md
  - manuscript/99-BACK/05-sources-and-further-reading.md

